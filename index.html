<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantau Pengerjaan Mapel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#eef2fb; --bg2:#f7f2fa;
    --ink:#16203d; --muted:#667090; --line:#e1e6f3;
    --card:#ffffff; --card-soft:#f6f8fd;
    --hero:linear-gradient(135deg,#1a2a6c 0%,#2b5cc4 55%,#14a3a8 100%);
    --ok:linear-gradient(135deg,#0e9f6e,#3ddba6);
    --no:linear-gradient(135deg,#ef3f66,#ff9a5c);
    --ok-ink:#0b7a55; --no-ink:#c42a4d;
    --ok-tint:#e3f7ef; --no-tint:#fdebee;
    --accent:#2b5cc4;
    --shadow:0 10px 30px -12px rgba(30,50,120,.25);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg1:#0d1226; --bg2:#141029;
      --ink:#e9edfb; --muted:#9aa4c8; --line:#27305a;
      --card:#171e3d; --card-soft:#1d2548;
      --hero:linear-gradient(135deg,#131c52 0%,#1f3f93 55%,#0e7f86 100%);
      --ok-ink:#5ee9b5; --no-ink:#ff9fb2;
      --ok-tint:#10382d; --no-tint:#3d1a26;
      --accent:#7fa6ff;
      --shadow:0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--ink);min-height:100vh;
    font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- Hero ---------- */
  .hero{
    background:var(--hero);color:#fff;
    padding:calc(28px + env(safe-area-inset-top,0px)) 20px 96px;
    position:relative;overflow:hidden;
  }
  .hero::before,.hero::after{
    content:"";position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%);
  }
  .hero::before{width:380px;height:380px;right:-120px;top:-170px}
  .hero::after{width:260px;height:260px;left:-90px;bottom:-150px}
  .hero-in{max-width:960px;margin:0 auto;position:relative}
  .hero h1{margin:0 0 6px;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .hero p{margin:0;opacity:.85;font-size:.95rem;max-width:46ch}

  .wrap{max-width:960px;margin:-64px auto 0;padding:0 16px 48px;position:relative}

  /* ---------- Form ---------- */
  form{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:18px;
    display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end;
  }
  label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px}
  input[type=text],input:not([type]){
    width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--card-soft);color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{color:var(--muted);opacity:.6}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
  button{
    font:inherit;font-weight:700;cursor:pointer;color:#fff;border:0;border-radius:12px;
    padding:13px 26px;background:var(--hero);
    box-shadow:0 8px 20px -8px rgba(43,92,196,.7);
    transition:transform .12s,box-shadow .12s,opacity .12s;
  }
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.6;cursor:wait;transform:none}
  button:focus-visible,input:focus-visible,.switch input:focus-visible+.track{outline:3px solid var(--accent);outline-offset:2px}

  /* ---------- Status ---------- */
  #msg{margin:18px 4px 0;color:var(--muted);font-size:.95rem}
  #msg:empty{display:none}
  #msg.err{color:var(--no-ink);font-weight:600}

  .bar{
    display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    margin:18px 4px 0;color:var(--muted);font-size:.85rem;
  }
  .bar[hidden]{display:none}
  .bar .warn{color:var(--no-ink);font-weight:600}
  .switch{display:flex;align-items:center;gap:10px;margin:0;cursor:pointer;color:var(--ink);font-weight:500;font-size:.85rem}
  .switch input{position:absolute;opacity:0;width:1px;height:1px}
  .track{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
  .track::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .switch input:checked+.track{background:var(--ok)}
  .switch input:checked+.track::after{transform:translateX(18px)}

  /* ---------- Ringkasan ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .stat small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
  .stat b{display:block;font-size:2rem;font-weight:800;line-height:1.15;letter-spacing:-.02em;
    background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat.ok b{background:var(--ok);-webkit-background-clip:text;background-clip:text}
  .stat.no b{background:var(--no);-webkit-background-clip:text;background-clip:text}

  .meter{height:10px;border-radius:99px;background:var(--no-tint);overflow:hidden}
  .meter i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s ease}
  .overall{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 18px;box-shadow:var(--shadow)}
  .overall .row{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem;margin-bottom:10px}
  .overall .row span:last-child{color:var(--ok-ink)}

  /* ---------- Ruang ---------- */
  .ruang{
    background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:16px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .ruang-h{padding:16px 18px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--card-soft),var(--card))}
  .ruang-h .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .ruang-h h2{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
  .ruang-h .c{color:var(--muted);font-size:.85rem;font-weight:500}
  .cols{display:grid;grid-template-columns:1fr 1fr}
  .col{padding:16px 18px 18px;min-width:0}
  .col+.col{border-left:1px solid var(--line)}
  .col h3{margin:0 0 12px;font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px}
  .col h3 em{font-style:normal;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px}
  .belum h3{color:var(--no-ink)} .belum h3 em{background:var(--no-tint)}
  .sudah h3{color:var(--ok-ink)} .sudah h3 em{background:var(--ok-tint)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card-soft);min-width:0}
  .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:.8rem}
  .belum .av{background:var(--no)} .sudah .av{background:var(--ok)}
  .nm{min-width:0}
  .nm b{display:block;font-weight:600;font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
  .nm small{color:var(--muted);font-size:.78rem}
  .kosong{color:var(--muted);font-size:.9rem;padding:10px 4px}

  /* ---------- Mobile ---------- */
  @media (max-width:760px){
    form{grid-template-columns:1fr;padding:16px}
    button{width:100%;padding:14px}
    .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
    .stat{padding:12px 12px}
    .stat b{font-size:1.5rem}
    .stat small{font-size:.74rem}
  }
  @media (max-width:640px){
    .cols{grid-template-columns:1fr}
    .col+.col{border-left:0;border-top:1px solid var(--line)}
    .hero{padding-bottom:88px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <h1>Pantau pengerjaan mapel</h1>
    <p>Lihat siapa yang sudah dan belum mengerjakan, dikelompokkan per ruang.</p>
  </div>
</header>

<main class="wrap">
  <form id="f">
    <div><label for="kelas">Kelas</label>
      <input id="kelas" type="text" required placeholder="mis. 7A" autocomplete="off" autocapitalize="characters"></div>
    <div><label for="kode">Kode Mapel</label>
      <input id="kode" type="text" placeholder="mis. IPABAB1" autocomplete="off" autocapitalize="characters"></div>
    <div><label for="mapel">Mata Pelajaran</label>
      <input id="mapel" type="text" placeholder="mis. IPA" autocomplete="off" autocapitalize="characters"></div>
    <div><button id="btn" type="submit">Tampilkan</button></div>
  </form>

  <div id="msg" role="status">Isi kelas, lalu Kode Mapel dan/atau Mata Pelajaran.</div>

  <div id="bar" class="bar" hidden>
    <span id="stamp"></span>
    <label class="switch"><input type="checkbox" id="auto" checked><span class="track"></span>Perbarui otomatis tiap 30 detik</label>
  </div>

  <div id="out"></div>
</main>

<script>
  // GANTI dengan URL Web App Anda (.../exec)
  var API_URL = "https://script.google.com/macros/s/AKfycbzOwSWkSqF0PervY6pRhpUzyRYfUfuYv947willFpAcgAqc7aJyCYE8HDKOI4mpY3Eypw/exec";
  var INTERVAL = 30; // detik

  var f = document.getElementById("f"), btn = document.getElementById("btn"),
      msg = document.getElementById("msg"), out = document.getElementById("out"),
      bar = document.getElementById("bar"), stamp = document.getElementById("stamp"),
      auto = document.getElementById("auto");

  var current = null;   // parameter pencarian terakhir
  var loading = false;
  var countdown = INTERVAL;
  var lastTime = "";
  var failed = false;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function setMsg(t, isErr){ msg.textContent = t; msg.className = isErr ? "err" : ""; }

  function list(items){
    if (!items.length) return '<div class="kosong">Tidak ada</div>';
    return "<ul>" + items.map(function(p){
      var ini = (p.nama.trim().charAt(0) || "?").toUpperCase();
      return '<li><span class="av" aria-hidden="true">' + esc(ini) + '</span>' +
        '<span class="nm"><b>' + esc(p.nama) + '</b><small>' + esc(p.noPeserta) + '</small></span></li>';
    }).join("") + "</ul>";
  }

  function updateBar(){
    var t = lastTime ? "Diperbarui pukul " + lastTime : "";
    if (failed) t += ' <span class="warn">(gagal memperbarui, data lama ditampilkan)</span>';
    if (loading) t += " · memuat…";
    else if (auto.checked) t += " · muat ulang dalam " + countdown + " dtk";
    else t += " · pembaruan otomatis mati";
    stamp.innerHTML = t;
  }

  // silent = true untuk refresh otomatis (tanpa mengosongkan tampilan)
  function load(silent){
    if (!current || loading) return;
    loading = true; btn.disabled = true;
    if (!silent){ out.innerHTML = ""; bar.hidden = true; setMsg("Memuat data…"); }
    updateBar();

    var url = API_URL + "?action=absensi&kelas=" + encodeURIComponent(current.kelas) +
      "&kodeMapel=" + encodeURIComponent(current.kode) +
      "&mapel=" + encodeURIComponent(current.mapel) + "&_=" + Date.now();

    fetch(url).then(function(r){ return r.json(); }).then(function(res){
      if (res.status !== "success"){
        if (silent){ failed = true; }
        else { setMsg(res.message || "Gagal memuat data.", true); current = null; }
        return;
      }
      failed = false;
      lastTime = new Date().toLocaleTimeString("id-ID");
      render(res, current.kelas.toUpperCase());
    }).catch(function(err){
      if (silent){ failed = true; }
      else { setMsg("Tidak dapat terhubung ke server: " + err.message, true); current = null; }
    }).then(function(){
      loading = false; btn.disabled = false; countdown = INTERVAL; updateBar();
    });
  }

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var kelas = document.getElementById("kelas").value.trim();
    var kode  = document.getElementById("kode").value.trim();
    var mapel = document.getElementById("mapel").value.trim();
    if (!kode && !mapel){ setMsg("Isi Kode Mapel atau Mata Pelajaran.", true); return; }
    current = {kelas: kelas, kode: kode, mapel: mapel};
    failed = false;
    load(false);
  });

  // Hitung mundur tiap detik; saat 0, muat ulang diam-diam
  setInterval(function(){
    if (!current || loading || !auto.checked || document.hidden) return;
    countdown--;
    if (countdown <= 0) load(true); else updateBar();
  }, 1000);

  auto.addEventListener("change", function(){ countdown = INTERVAL; updateBar(); });

  // Saat tab kembali aktif dan data sudah lama, segarkan segera
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && current && auto.checked && countdown <= 5) load(true);
  });

  function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

  function render(res, kelas){
    var done = {};
    res.selesai.forEach(function(no){ done[no] = true; });

    // Bandingkan ABSENSI dengan data pengerjaan, kelompokkan per ruang
    var rooms = {};
    var total = 0, sudah = 0;
    res.absensi.forEach(function(p){
      var key = p.ruang || "(tanpa ruang)";
      (rooms[key] = rooms[key] || {sudah:[], belum:[]});
      if (done[p.noPeserta]) { rooms[key].sudah.push(p); sudah++; }
      else rooms[key].belum.push(p);
      total++;
    });

    if (!total){
      out.innerHTML = ""; bar.hidden = true;
      setMsg("Tidak ada peserta kelas " + kelas + " di sheet ABSENSI.", true); return;
    }
    setMsg(""); bar.hidden = false;

    var byName = function(a,b){ return a.nama.localeCompare(b.nama, "id"); };
    var names = Object.keys(rooms).sort(function(a,b){
      return a.localeCompare(b, "id", {numeric:true}); });

    var html =
      '<div class="stats">' +
        '<div class="stat"><small>Peserta kelas ' + esc(kelas) + '</small><b>' + total + '</b></div>' +
        '<div class="stat ok"><small>Sudah</small><b>' + sudah + '</b></div>' +
        '<div class="stat no"><small>Belum</small><b>' + (total - sudah) + '</b></div>' +
      '</div>' +
      '<div class="overall"><div class="row"><span>Progres keseluruhan</span><span>' + pct(sudah,total) + '%</span></div>' +
      '<div class="meter"><i style="width:' + pct(sudah,total) + '%"></i></div></div>';

    names.forEach(function(n){
      var r = rooms[n]; r.sudah.sort(byName); r.belum.sort(byName);
      var t = r.sudah.length + r.belum.length;
      html += '<section class="ruang">' +
        '<div class="ruang-h"><div class="t"><h2>Ruang ' + esc(n) + '</h2>' +
        '<span class="c">' + r.sudah.length + ' dari ' + t + ' selesai</span></div>' +
        '<div class="meter"><i style="width:' + pct(r.sudah.length,t) + '%"></i></div></div>' +
        '<div class="cols">' +
        '<div class="col belum"><h3>Belum mengerjakan <em>' + r.belum.length + '</em></h3>' + list(r.belum) + '</div>' +
        '<div class="col sudah"><h3>Sudah mengerjakan <em>' + r.sudah.length + '</em></h3>' + list(r.sudah) + '</div>' +
        '</div></section>';
    });

    var y = window.scrollY;      // jaga posisi gulir saat refresh
    out.innerHTML = html;
    window.scrollTo(0, y);
  }
</script>
</body>
</html>
