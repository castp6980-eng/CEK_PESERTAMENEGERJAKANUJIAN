<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantau Pengerjaan Ujian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#eef2fb; --bg2:#f7f2fa;
    --ink:#16203d; --muted:#667090; --line:#e1e6f3;
    --card:#ffffff; --card-soft:#f6f8fd;
    --hero:linear-gradient(135deg,#1a2a6c 0%,#2b5cc4 55%,#14a3a8 100%);
    --ok:linear-gradient(135deg,#0e9f6e,#3ddba6);
    --no:linear-gradient(135deg,#ef3f66,#ff9a5c);
    --ok-ink:#0b7a55; --no-ink:#c42a4d;
    --ok-tint:#e3f7ef; --no-tint:#fdebee;
    --accent:#2b5cc4;
    --shadow:0 10px 30px -12px rgba(30,50,120,.25);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg1:#0d1226; --bg2:#141029;
      --ink:#e9edfb; --muted:#9aa4c8; --line:#27305a;
      --card:#171e3d; --card-soft:#1d2548;
      --hero:linear-gradient(135deg,#131c52 0%,#1f3f93 55%,#0e7f86 100%);
      --ok-ink:#5ee9b5; --no-ink:#ff9fb2;
      --ok-tint:#10382d; --no-tint:#3d1a26;
      --accent:#7fa6ff;
      --shadow:0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--ink);min-height:100vh;
    font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- Hero ---------- */
  .hero{
    background:var(--hero);color:#fff;
    padding:calc(28px + env(safe-area-inset-top,0px)) 20px 96px;
    position:relative;overflow:hidden;
  }
  .hero::before,.hero::after{
    content:"";position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%);
  }
  .hero::before{width:380px;height:380px;right:-120px;top:-170px}
  .hero::after{width:260px;height:260px;left:-90px;bottom:-150px}
  .hero-in{max-width:960px;margin:0 auto;position:relative}
  .hero h1{margin:0 0 6px;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .hero p{margin:0;opacity:.85;font-size:.95rem;max-width:46ch}

  .wrap{max-width:960px;margin:-64px auto 0;padding:0 16px 48px;position:relative}

  /* ---------- Kartu filter ---------- */
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:18px;
  }
  .panel+.panel{margin-top:12px}
  .panel .ttl{margin:0 0 12px;font-weight:700;font-size:.92rem}
  .panel .ttl small{color:var(--muted);font-weight:500;margin-left:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end}
  .hint{margin:12px 0 0;color:var(--muted);font-size:.8rem}
  .hint:empty{display:none}

  label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px}
  input[type=text],input:not([type]),select{
    width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--card-soft);color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  select{cursor:pointer}
  select:disabled{opacity:.6;cursor:not-allowed}
  input::placeholder{color:var(--muted);opacity:.6}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
  button{
    font:inherit;font-weight:700;cursor:pointer;color:#fff;border:0;border-radius:12px;
    padding:13px 26px;background:var(--hero);
    box-shadow:0 8px 20px -8px rgba(43,92,196,.7);
    transition:transform .12s,box-shadow .12s,opacity .12s;
  }
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.6;cursor:wait;transform:none}
  button:focus-visible,input:focus-visible,select:focus-visible,.switch input:focus-visible+.track{outline:3px solid var(--accent);outline-offset:2px}
  button.ghost{
    background:var(--card-soft);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;padding:11px 20px;
  }

  /* ---------- Status ---------- */
  #msg{margin:18px 4px 0;color:var(--muted);font-size:.95rem}
  #msg:empty{display:none}
  #msg.err{color:var(--no-ink);font-weight:600}

  .bar{
    display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    margin:18px 4px 0;color:var(--muted);font-size:.85rem;
  }
  .bar[hidden]{display:none}
  .bar .warn{color:var(--no-ink);font-weight:600}
  .switch{display:flex;align-items:center;gap:10px;margin:0;cursor:pointer;color:var(--ink);font-weight:500;font-size:.85rem}
  .switch input{position:absolute;opacity:0;width:1px;height:1px}
  .track{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
  .track::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .switch input:checked+.track{background:var(--ok)}
  .switch input:checked+.track::after{transform:translateX(18px)}

  /* ---------- Ringkasan ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .stat small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
  .stat b{display:block;font-size:2rem;font-weight:800;line-height:1.15;letter-spacing:-.02em;
    background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat.ok b{background:var(--ok);-webkit-background-clip:text;background-clip:text}
  .stat.no b{background:var(--no);-webkit-background-clip:text;background-clip:text}

  .meter{height:10px;border-radius:99px;background:var(--no-tint);overflow:hidden}
  .meter i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s ease}
  .overall{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 18px;box-shadow:var(--shadow)}
  .overall .row{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem;margin-bottom:10px}
  .overall .row span:last-child{color:var(--ok-ink)}

  /* ---------- Ruang ---------- */
  .ruang{
    background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:16px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .ruang-h{padding:16px 18px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--card-soft),var(--card))}
  .ruang-h .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .ruang-h h2{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
  .ruang-h .c{color:var(--muted);font-size:.85rem;font-weight:500}
  .cols{display:grid;grid-template-columns:1fr 1fr}
  .col{padding:16px 18px 18px;min-width:0}
  .col+.col{border-left:1px solid var(--line)}
  .col h3{margin:0 0 12px;font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px}
  .col h3 em{font-style:normal;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px}
  .belum h3{color:var(--no-ink)} .belum h3 em{background:var(--no-tint)}
  .sudah h3{color:var(--ok-ink)} .sudah h3 em{background:var(--ok-tint)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card-soft);min-width:0}
  .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:.8rem}
  .belum .av{background:var(--no)} .sudah .av{background:var(--ok)}
  .nm{min-width:0}
  .nm b{display:block;font-weight:600;font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
  .nm small{display:block;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
  .kosong{color:var(--muted);font-size:.9rem;padding:10px 4px}
  .kosong.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:18px;margin-top:14px;text-align:center}

  /* ---------- Mobile ---------- */
  @media (max-width:760px){
    .panel{padding:16px}
    .grid3{grid-template-columns:1fr 1fr}
    .grid3 .go{grid-column:1/-1}
    .grid3 .go button{width:100%;padding:14px}
    .stats{gap:8px}
    .stat{padding:12px}
    .stat b{font-size:1.5rem}
    .stat small{font-size:.74rem}
  }
  @media (max-width:640px){
    .cols{grid-template-columns:1fr}
    .col+.col{border-left:0;border-top:1px solid var(--line)}
    .hero{padding-bottom:88px}
  }
  @media (max-width:480px){
    .grid2{grid-template-columns:1fr 1fr}
    .grid2 .rst{grid-column:1/-1}
    .grid2 .rst button{width:100%}
    .grid3{grid-template-columns:1fr}
  }

  /* ---------- Pop up status koneksi ---------- */
  .conn{
    position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:50;
    display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);
    padding:11px 18px;border-radius:99px;font-weight:700;font-size:.9rem;
    background:var(--card);color:var(--ink);border:1.5px solid var(--line);
    box-shadow:0 14px 34px -10px rgba(20,30,80,.45);
    transform:translate(-50%,-140%);opacity:0;pointer-events:none;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .25s;
  }
  .conn.show{transform:translate(-50%,0);opacity:1}
  .conn .ic{width:18px;height:18px;flex:none;border-radius:50%;position:relative}
  .conn.connecting .ic,.conn.reconnecting .ic{
    border:2.5px solid color-mix(in srgb,var(--accent) 25%,transparent);
    border-top-color:var(--accent);animation:spin .8s linear infinite;
  }
  .conn.reconnecting{border-color:var(--no-ink);color:var(--no-ink)}
  .conn.reconnecting .ic{border-color:color-mix(in srgb,var(--no-ink) 25%,transparent);border-top-color:var(--no-ink)}
  .conn.connected{border-color:var(--ok-ink);color:var(--ok-ink)}
  .conn.connected .ic{background:var(--ok)}
  .conn.connected .ic::after{
    content:"";position:absolute;left:5.5px;top:2.5px;width:4px;height:8px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.conn .ic{animation:none!important}}
</style>
</head>
<body>

<div id="conn" class="conn" role="status" aria-live="polite"><span class="ic" aria-hidden="true"></span><span id="connTxt"></span></div>

<header class="hero">
  <div class="hero-in">
    <h1>Pantau Pengerjaan Ujian</h1>
    <p>Lihat siapa yang sudah dan belum mengirim, per ruang dan tanggal pengiriman.</p>
  </div>
</header>

<main class="wrap">
  <!-- Filter utama -->
  <section class="panel">
    <p class="ttl">Filter utama</p>
    <div class="grid2">
      <div><label for="fRuang">Ruang</label>
        <select id="fRuang" disabled><option value="">Semua ruang</option></select></div>
      <div><label for="fTgl">Tanggal pengiriman</label>
        <select id="fTgl" disabled><option value="">Semua tanggal</option></select></div>
      <div class="rst"><button type="button" id="rst" class="ghost">Reset</button></div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <!-- Filter tambahan (opsional) -->
  <form id="f" class="panel">
    <p class="ttl">Filter tambahan<small>opsional, boleh dikosongkan</small></p>
    <div class="grid3">
      <div><label for="kelas">Kelas</label>
        <input id="kelas" type="text" placeholder="mis. 7A (kosong = semua kelas)" autocomplete="off" autocapitalize="characters"></div>
      <div><label for="kode">Kode Mapel</label>
        <input id="kode" type="text" placeholder="mis. IPABAB1" autocomplete="off" autocapitalize="characters"></div>
      <div><label for="mapel">Mata Pelajaran</label>
        <input id="mapel" type="text" placeholder="mis. IPA" autocomplete="off" autocapitalize="characters"></div>
      <div class="go"><button id="btn" type="submit">Terapkan</button></div>
    </div>
  </form>

  <div id="msg" role="status">Memuat data…</div>

  <div id="bar" class="bar" hidden>
    <span id="stamp"></span>
    <label class="switch"><input type="checkbox" id="auto" checked><span class="track"></span>Perbarui otomatis tiap 30 detik</label>
  </div>

  <div id="out"></div>
</main>

<script>
  // GANTI dengan URL Web App Anda (.../exec)
  var API_URL = "https://script.google.com/macros/s/AKfycbzOwSWkSqF0PervY6pRhpUzyRYfUfuYv947willFpAcgAqc7aJyCYE8HDKOI4mpY3Eypw/exec";
  var INTERVAL = 30; // detik

  var $ = function(id){ return document.getElementById(id); };
  var f = $("f"), btn = $("btn"), msg = $("msg"), out = $("out"),
      bar = $("bar"), stamp = $("stamp"), auto = $("auto"),
      selRuang = $("fRuang"), selTgl = $("fTgl"), rst = $("rst"), hint = $("hint");

  var current = {kelas:"", kode:"", mapel:""};   // filter tambahan (dikirim ke server)
  var data = null;                               // hasil terakhir dari server
  var fRuang = "", fTgl = "";                    // filter utama (diterapkan di browser)
  var loading = false, countdown = INTERVAL, lastTime = "", failed = false;


  /* ---------- Pop up status koneksi ---------- */
  var conn = $("conn"), connTxt = $("connTxt"), connTimer = null, retryTimer = null,
      online = true, RETRY = 5000;
  var CONN_TEXT = {
    connecting:   "Sedang tersambung ke server…",
    connected:    "Tersambung ke server",
    reconnecting: "Menyambungkan ulang…"
  };
  function showConn(state, autoHideMs){
    clearTimeout(connTimer);
    conn.className = "conn show " + state;
    connTxt.textContent = CONN_TEXT[state];
    if (autoHideMs) connTimer = setTimeout(function(){ conn.classList.remove("show"); }, autoHideMs);
  }
  function hideConn(){ clearTimeout(connTimer); conn.classList.remove("show"); }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function setMsg(t, isErr){ msg.textContent = t; msg.className = isErr ? "err" : ""; }

  // "2026-11-22" -> "22 November 2026"
  function fmtTgl(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return iso;
    return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString("id-ID",
      {day:"numeric", month:"long", year:"numeric"});
  }

  // Teks pengiriman: "IPA · 22 November 2026, 08:15" (maks 3, sisanya "+n lainnya")
  function waktuText(entries){
    var parts = entries.slice(0, 3).map(function(d){
      var t = [d.tanggal ? fmtTgl(d.tanggal) : "", d.jam].filter(Boolean).join(", ");
      var mp = d.mapel || d.kodeMapel;
      return [mp, t].filter(Boolean).join(" · ");
    }).filter(Boolean);
    if (entries.length > 3) parts.push("+" + (entries.length - 3) + " lainnya");
    return parts;
  }

  // list(items, info, mode): mode "sudah" -> tampilkan waktu kirim; "belum" -> catatan bila kirim di tanggal lain
  function list(items, info, mode){
    if (!items.length) return '<div class="kosong">Tidak ada</div>';
    return "<ul>" + items.map(function(p){
      var ini = (p.nama.trim().charAt(0) || "?").toUpperCase();
      var sub = '<small>' + esc(p.noPeserta) + (p.kelas ? ' · ' + esc(p.kelas) : '') + '</small>';
      var ent = info[p.noPeserta] || [];
      if (mode === "sudah"){
        var shown = fTgl ? ent.filter(function(d){ return d.tanggal === fTgl; }) : ent;
        waktuText(shown).forEach(function(t){ sub += '<small>' + esc(t) + '</small>'; });
      } else if (fTgl && ent.length){
        var tg = {};
        ent.forEach(function(d){ if (d.tanggal) tg[d.tanggal] = true; });
        var ks = Object.keys(tg).sort().map(fmtTgl).join(", ");
        if (ks) sub += '<small>Mengirim di tanggal lain: ' + esc(ks) + '</small>';
      }
      return '<li><span class="av" aria-hidden="true">' + esc(ini) + '</span>' +
        '<span class="nm"><b>' + esc(p.nama) + '</b>' + sub + '</span></li>';
    }).join("") + "</ul>";
  }

  function updateBar(){
    var t = lastTime ? "Diperbarui pukul " + lastTime : "";
    if (failed) t += ' <span class="warn">(gagal memperbarui, data lama ditampilkan)</span>';
    if (loading) t += " · memuat…";
    else if (auto.checked) t += " · muat ulang dalam " + countdown + " dtk";
    else t += " · pembaruan otomatis mati";
    stamp.innerHTML = t;
  }

  // silent = true untuk refresh otomatis (tanpa mengosongkan tampilan)
  function load(silent){
    if (loading) return;
    clearTimeout(retryTimer);
    loading = true; btn.disabled = true;
    if (!online) showConn("reconnecting");
    else if (!silent) showConn("connecting");
    if (!silent){ out.innerHTML = ""; bar.hidden = true; setMsg("Memuat data…"); }
    updateBar();

    var q = ["_=" + Date.now(), "action=absensi"];
    if (current.kelas) q.push("kelas=" + encodeURIComponent(current.kelas));
    if (current.kode)  q.push("kodeMapel=" + encodeURIComponent(current.kode));
    if (current.mapel) q.push("mapel=" + encodeURIComponent(current.mapel));

    fetch(API_URL + "?" + q.join("&")).then(function(r){ return r.json(); }).then(function(res){
      if (res.status !== "success"){
        if (!online || !silent) showConn("connected", 2500); else hideConn();
        online = true;
        if (silent || data){ failed = true; if (!silent) setMsg(res.message || "Gagal memuat data.", true); }
        else setMsg(res.message || "Gagal memuat data.", true);
        return;
      }
      if (!online || !silent) showConn("connected", 2500); else hideConn();
      online = true;
      failed = false;
      lastTime = new Date().toLocaleTimeString("id-ID");
      data = res;
      buildFilters();
      render();
    }).catch(function(err){
      online = false;
      showConn("reconnecting");
      clearTimeout(retryTimer);
      retryTimer = setTimeout(function(){ load(true); }, RETRY);   // coba lagi otomatis
      if (silent){ failed = true; }
      else setMsg("Tidak dapat terhubung ke server: " + err.message, true);
    }).then(function(){
      loading = false; btn.disabled = false; countdown = INTERVAL; updateBar();
    });
  }

  // Filter tambahan: ambil ulang dari server
  f.addEventListener("submit", function(e){
    e.preventDefault();
    current = {
      kelas: $("kelas").value.trim(),
      kode:  $("kode").value.trim(),
      mapel: $("mapel").value.trim()
    };
    failed = false;
    load(false);
  });

  // Hitung mundur tiap detik; saat 0, muat ulang diam-diam
  setInterval(function(){
    if (loading || !auto.checked || document.hidden) return;
    countdown--;
    if (countdown <= 0) load(true); else updateBar();
  }, 1000);

  // Perangkat kehilangan / mendapatkan internet
  window.addEventListener("offline", function(){ online = false; showConn("reconnecting"); });
  window.addEventListener("online", function(){ clearTimeout(retryTimer); load(true); });

  auto.addEventListener("change", function(){ countdown = INTERVAL; updateBar(); });

  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && data && auto.checked && countdown <= 5) load(true);
  });

  /* ---------- Filter utama (Ruang & Tanggal) ---------- */
  function buildFilters(){
    var rs = {}, ts = {};
    data.absensi.forEach(function(p){ rs[p.ruang || "(tanpa ruang)"] = true; });
    (data.detail || []).forEach(function(d){ if (d.tanggal) ts[d.tanggal] = true; });

    var rooms = Object.keys(rs).sort(function(a,b){ return a.localeCompare(b, "id", {numeric:true}); });
    var dates = Object.keys(ts).sort().reverse();   // terbaru di atas

    if (fRuang && !rs[fRuang]) fRuang = "";
    if (fTgl && !ts[fTgl]) fTgl = "";

    selRuang.innerHTML = '<option value="">Semua ruang</option>' + rooms.map(function(r){
      return '<option value="' + esc(r) + '">Ruang ' + esc(r) + '</option>'; }).join("");
    selTgl.innerHTML = '<option value="">Semua tanggal</option>' + dates.map(function(d){
      return '<option value="' + esc(d) + '">' + esc(fmtTgl(d)) + '</option>'; }).join("");

    selRuang.value = fRuang;  selTgl.value = fTgl;
    selRuang.disabled = !rooms.length;
    selTgl.disabled = !dates.length;
  }

  selRuang.addEventListener("change", function(){ fRuang = selRuang.value; if (data) render(); });
  selTgl.addEventListener("change", function(){ fTgl = selTgl.value; if (data) render(); });
  rst.addEventListener("click", function(){
    fRuang = ""; fTgl = "";
    selRuang.value = ""; selTgl.value = "";
    $("kelas").value = ""; $("kode").value = ""; $("mapel").value = "";
    var berubah = current.kelas || current.kode || current.mapel;
    current = {kelas:"", kode:"", mapel:""};
    if (berubah) load(false); else if (data) render();
  });

  function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

  /* ---------- Tampilan ---------- */
  function render(){
    if (!data.absensi.length){
      out.innerHTML = ""; bar.hidden = true;
      setMsg(current.kelas
        ? "Tidak ada peserta kelas " + current.kelas.toUpperCase() + " di sheet ABSENSI."
        : "Tidak ada peserta di sheet ABSENSI.", true);
      return;
    }
    setMsg(""); bar.hidden = false;

    // No Peserta -> daftar pengiriman
    var info = {};
    (data.detail || []).forEach(function(d){ (info[d.noPeserta] = info[d.noPeserta] || []).push(d); });
    var done = {};
    data.selesai.forEach(function(no){ done[no] = true; });

    // Terapkan filter ruang & tanggal, kelompokkan per ruang
    var rooms = {}, total = 0, sudah = 0;
    data.absensi.forEach(function(p){
      var key = p.ruang || "(tanpa ruang)";
      if (fRuang && key !== fRuang) return;

      var isDone = fTgl
        ? (info[p.noPeserta] || []).some(function(d){ return d.tanggal === fTgl; })
        : !!done[p.noPeserta];

      (rooms[key] = rooms[key] || {sudah:[], belum:[]});
      if (isDone){ rooms[key].sudah.push(p); sudah++; }
      else rooms[key].belum.push(p);
      total++;
    });

    // Keterangan filter aktif
    var ket = [];
    if (current.kelas) ket.push("kelas " + current.kelas.toUpperCase());
    if (current.kode)  ket.push("kode " + current.kode.toUpperCase());
    if (current.mapel) ket.push("mapel " + current.mapel.toUpperCase());
    var h = [];
    h.push(ket.length ? "Filter tambahan: " + ket.join(", ") + "." : "Tanpa filter tambahan: semua kelas dan semua mata pelajaran.");
    if (!current.kode && !current.mapel) h.push("“Sudah” berarti mengirim minimal satu mapel.");
    if (fTgl) h.push("Pada tanggal " + fmtTgl(fTgl) + ", “Belum” berarti tidak mengirim pada tanggal itu.");
    hint.textContent = h.join(" ");

    if (!total){
      out.innerHTML = '<div class="kosong card">Tidak ada peserta yang sesuai filter.</div>';
      return;
    }

    var byName = function(a,b){ return a.nama.localeCompare(b.nama, "id"); };
    var names = Object.keys(rooms).sort(function(a,b){ return a.localeCompare(b, "id", {numeric:true}); });
    var aktif = !!(fRuang || fTgl);
    var judul = current.kelas ? "Peserta kelas " + esc(current.kelas.toUpperCase()) : "Peserta semua kelas";

    var html =
      '<div class="stats">' +
        '<div class="stat"><small>' + judul + (aktif ? ' (terfilter)' : '') + '</small><b>' + total + '</b></div>' +
        '<div class="stat ok"><small>Sudah</small><b>' + sudah + '</b></div>' +
        '<div class="stat no"><small>Belum</small><b>' + (total - sudah) + '</b></div>' +
      '</div>' +
      '<div class="overall"><div class="row"><span>Progres' + (aktif ? ' (sesuai filter)' : ' keseluruhan') + '</span><span>' + pct(sudah,total) + '%</span></div>' +
      '<div class="meter"><i style="width:' + pct(sudah,total) + '%"></i></div></div>';

    names.forEach(function(n){
      var r = rooms[n]; r.sudah.sort(byName); r.belum.sort(byName);
      var t = r.sudah.length + r.belum.length;
      html += '<section class="ruang">' +
        '<div class="ruang-h"><div class="t"><h2>Ruang ' + esc(n) + '</h2>' +
        '<span class="c">' + r.sudah.length + ' dari ' + t + ' selesai</span></div>' +
        '<div class="meter"><i style="width:' + pct(r.sudah.length,t) + '%"></i></div></div>' +
        '<div class="cols">' +
        '<div class="col belum"><h3>Belum mengerjakan <em>' + r.belum.length + '</em></h3>' + list(r.belum, info, "belum") + '</div>' +
        '<div class="col sudah"><h3>Sudah mengerjakan <em>' + r.sudah.length + '</em></h3>' + list(r.sudah, info, "sudah") + '</div>' +
        '</div></section>';
    });

    var y = window.scrollY;      // jaga posisi gulir saat refresh / ganti filter
    out.innerHTML = html;
    window.scrollTo(0, y);
  }

  // Muat data langsung saat halaman dibuka (tanpa filter tambahan)
  load(false);
</script>
</body>
</html>
